[project]
name = "proctoring-ai-service"
version = "1.0.0"
description = "Audio analysis worker for the proctoring platform: Silero VAD + faster-whisper over Redis Streams"
requires-python = ">=3.12,<3.13"
readme = "README.md"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Ordinary runs use fake models and need no downloads. Real-model tests: pytest -m models
addopts = "-m \"not models\" -p no:cacheprovider"
markers = [
    "models: loads the real Silero VAD and faster-whisper models (downloads the Whisper model once)",
    "integration: needs Docker (starts a Redis container with testcontainers)",
]
filterwarnings = [
    "ignore::FutureWarning",
    "ignore::DeprecationWarning",
]
