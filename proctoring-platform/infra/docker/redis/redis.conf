# Redis configuration for the proctoring streams (mounted by infra/docker-compose.yml).

# Persistence: the append-only file keeps stream entries, consumer groups and pending lists across
# restarts. "everysec" loses at most ~1 s of writes on a crash; the backend's SQLite outbox re-publishes
# events whose publish was lost.
appendonly yes
appendfsync everysec
dir /data

# Streams are capped by the producers (XADD MAXLEN ~); never evict keys because of memory pressure:
# an evicted stream would silently drop queued work.
maxmemory-policy noeviction

# Listen inside the container; the published port is bound to 127.0.0.1 by docker-compose.
bind 0.0.0.0
protected-mode no
port 6379
